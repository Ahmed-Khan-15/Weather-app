<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Old+Turkic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="input_container">
            <input class="input_bar" type="text" placeholder="Enter A City">
            <button class="search_city">Get Weather</button>
        </div>
        <section class="card">
            <h2 class="city_name">Karachi</h2>
            <p class="emoji">🟡</p>
            <p class="weather_type">sunny</p>
            <p class="temperature">27°C</p>
            <div class="description_container">
                <p class="wind details">wind</p>
                <p class="humidity details">humidity</p>
                <p class="atm_pressure details">atm pressure</p>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
